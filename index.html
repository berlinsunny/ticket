<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>淘票票票根镂空机</title>

<style>
body{
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
    text-align:center;
}

.card{
    background:white;
    border-radius:16px;
    padding:20px;
    max-width:600px;
    margin:auto;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

h2{
    margin-top:0;
}

input{
    margin:15px 0;
}

#result{
    display:none;
    max-width:100%;
    margin-top:20px;
    border-radius:12px;
}

.tip{
    color:#666;
    margin-top:10px;
    line-height:1.6;
}
</style>
</head>
<body>

<div class="card">

<h2>🎬 淘票票票根镂空机</h2>

<input type="file" id="upload" accept="image/*">

<div class="tip">
上传图片后自动生成<br>
长按结果图片即可保存
</div>

<img id="result">

</div>

<script>

const upload = document.getElementById("upload");
const result = document.getElementById("result");

upload.addEventListener("change", (e)=>{

    const file = e.target.files[0];
    if(!file) return;

    const img = new Image();

    img.onload = ()=>{

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        canvas.width = img.width;
        canvas.height = img.height;

        ctx.drawImage(img,0,0);

        ctx.globalCompositeOperation = "destination-out";

        const holes = [0.16,0.50,0.84];

        const radius = Math.max(
            img.width * 0.03,
            20
        );

        holes.forEach(y=>{

            ctx.beginPath();
            ctx.arc(
                0,
                img.height * y,
                radius,
                0,
                Math.PI * 2
            );
            ctx.fill();

            ctx.beginPath();
            ctx.arc(
                img.width,
                img.height * y,
                radius,
                0,
                Math.PI * 2
            );
            ctx.fill();

        });

        result.src = canvas.toDataURL("image/png");
        result.style.display = "block";

    };

    img.src = URL.createObjectURL(file);

});

</script>

</body>
</html>
